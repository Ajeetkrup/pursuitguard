[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "pursuitguard"
version = "0.1.0"
description = "AEC Go/No-Go Pursuit Qualification Agent with Read-Only CRM MCP & Stateful LangGraph"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.115.0",
    "google-genai>=2.33.0,<3",
    "langchain-core>=1.0.0",
    "langchain-google-genai>=4.0.0",
    "langfuse>=3.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "mcp>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "rapidfuzz>=3.9.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]
